# ==========================================
# BRAINBRUSH — HORIZONTALLY SCALED DEPLOYMENT
# ==========================================
# This compose file demonstrates distributed systems concepts:
#   - 3 backend instances (horizontal scaling)
#   - Nginx reverse proxy with WebSocket-aware load balancing
#   - Redis for cross-instance state + Socket.IO Adapter
#   - MongoDB for persistent storage
#
# DS Topics: Distributed Architecture, Middleware, Scalability,
#            Location Transparency, Load Balancing
#
# Usage:
#   docker compose -f docker-compose.scaled.yml up --build
# ==========================================

services:

  # ==========================================
  # NGINX — REVERSE PROXY + LOAD BALANCER
  # ==========================================
  # Acts as the single entry point for all client connections.
  # Distributes traffic across the 3 backend instances using
  # ip_hash (sticky sessions) to ensure WebSocket upgrades
  # always route to the same backend.
  nginx:
    image: nginx:alpine
    container_name: brainbrush-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped

  # ==========================================
  # BACKEND INSTANCES (3x Node.js Servers)
  # ==========================================
  # Each instance is identical code, differentiated only by
  # INSTANCE_ID. The Socket.IO Redis Adapter ensures that
  # a drawing event received by backend-1 is broadcast to
  # clients connected to backend-2 and backend-3.
  backend-1:
    build: ./backend
    container_name: brainbrush-backend-1
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-1
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/brainbrush
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-prod}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - redis
      - mongo

  backend-2:
    build: ./backend
    container_name: brainbrush-backend-2
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-2
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/brainbrush
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-prod}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - redis
      - mongo

  backend-3:
    build: ./backend
    container_name: brainbrush-backend-3
    restart: unless-stopped
    environment:
      - PORT=5000
      - INSTANCE_ID=backend-3
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongo:27017/brainbrush
      - JWT_SECRET=${JWT_SECRET:-dev-secret-key-change-in-prod}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - ALLOWED_ORIGINS=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - redis
      - mongo

  # ==========================================
  # REDIS — IN-MEMORY DATA STORE
  # ==========================================
  # Single source of truth for:
  #   - Game state (rooms, scores, timers)
  #   - Socket.IO Redis Adapter (cross-instance pub/sub)
  #   - Active drawers, sessions, player names
  #   - Distributed timer locks
  #
  # In production, this would be Redis Sentinel or Cluster
  # for high availability.
  redis:
    image: redis:7-alpine
    container_name: brainbrush-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # ==========================================
  # MONGODB — PERSISTENT DATA STORE
  # ==========================================
  # Stores user profiles, game history, leaderboards.
  # Completely isolated from real-time game state.
  mongo:
    image: mongo:7
    container_name: brainbrush-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # ==========================================
  # FRONTEND — REACT SPA served by Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE_URL=http://localhost
    container_name: brainbrush-frontend
    restart: unless-stopped
    # Frontend is served through the main Nginx reverse proxy
    # on port 80, so it doesn't need its own exposed port

volumes:
  redis-data:
    driver: local
  mongo-data:
    driver: local
