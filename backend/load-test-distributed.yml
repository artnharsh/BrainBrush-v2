config:
  # TARGET will be set via environment variable or command line
  target: "{{ $processEnvironment.TARGET_URL }}"
  engines:
    socketio-v3:
      auth:
        token: "LOAD_TEST_TOKEN"
  
  # ==========================================
  # PHASED LOAD TEST
  # ==========================================
  # Phase 1: Warm up (30s) — 10 users/sec → ramp to 50
  # Phase 2: Sustained (60s) — Hold at 50 users/sec
  # Phase 3: Spike (30s) — Ramp to 100 users/sec (stress test)
  # Phase 4: Cool down (30s) — Drop to 10 users/sec
  phases:
    - name: "Warm-up"
      duration: 30
      arrivalRate: 10
      rampTo: 50

    - name: "Sustained Load"
      duration: 60
      arrivalRate: 50

    - name: "Spike Test"
      duration: 30
      arrivalRate: 50
      rampTo: 100
      maxVusers: 2000

    - name: "Cool Down"
      duration: 30
      arrivalRate: 10

scenarios:
  - name: "Full Game Simulation"
    engine: socketio-v3
    flow:
      # 1. Join room
      - emit:
          channel: "join_room"
          data: "LOADTEST"
      - think: 1

      # 2. Register player name
      - emit:
          channel: "register_name"
          data:
            id: "{{ $uuid }}"
            username: "LoadBot_{{ $randomNumber(1, 10000) }}"
      - think: 1

      # 3. Simulate drawing (batched segments at ~20fps for 5 seconds)
      - loop:
          - emit:
              channel: "draw_line_batch"
              data:
                roomCode: "LOADTEST"
                segments:
                  - x0: "{{ $randomNumber(0, 100) }}"
                    y0: "{{ $randomNumber(0, 100) }}"
                    x1: "{{ $randomNumber(0, 100) }}"
                    y1: "{{ $randomNumber(0, 100) }}"
                    color: "#000000"
                    width: 3
                    strokeId: "{{ $uuid }}"
          - think: 0.05
        count: 100

      # 4. Simulate chat/guessing
      - loop:
          - emit:
              channel: "guess_word"
              data:
                roomCode: "LOADTEST"
                guess: "guess_{{ $randomNumber(1, 500) }}"
          - think: 2
        count: 5

      # 5. Stay connected to maintain concurrency
      - think: 30

  - name: "Chat Only (Light User)"
    engine: socketio-v3
    flow:
      - emit:
          channel: "join_room"
          data: "LOADTEST"
      - think: 1

      - emit:
          channel: "register_name"
          data:
            id: "{{ $uuid }}"
            username: "ChatBot_{{ $randomNumber(1, 10000) }}"

      - loop:
          - emit:
              channel: "guess_word"
              data:
                roomCode: "LOADTEST"
                guess: "guess_{{ $randomNumber(1, 500) }}"
          - think: 3
        count: 10

      - think: 20
