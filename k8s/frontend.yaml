# ==========================================
# FRONTEND DEPLOYMENT — React SPA served by Nginx
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: brainbrush-frontend
  labels:
    app: brainbrush
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: brainbrush
      component: frontend
  template:
    metadata:
      labels:
        app: brainbrush
        component: frontend
    spec:
      containers:
        - name: frontend
          image: caliber001/brainbrush-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  labels:
    app: brainbrush
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: brainbrush
    component: frontend
  ports:
    - port: 80
      targetPort: 80
