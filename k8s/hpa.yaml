# ==========================================
# HORIZONTAL POD AUTOSCALER (HPA)
# ==========================================
# Automatically scales the backend deployment based on CPU usage.
#
# DS Concept: Elastic Scalability, Auto-Scaling
# When CPU usage exceeds 70%, K8s automatically creates more pods.
# When load drops, it scales back down. This is how distributed
# systems handle variable traffic patterns.
#
# Scaling behavior:
#   - Min replicas: 3 (always have at least 3 backend instances)
#   - Max replicas: 10 (cap at 10 to control costs)
#   - Scale up when average CPU > 70%
#   - Scale down when average CPU < 70% (with cooldown)
#
# DEMO: Run Artillery load test → watch pod count increase:
#   kubectl get hpa -w
#   kubectl get pods -w
# ==========================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: brainbrush-backend-hpa
  labels:
    app: brainbrush
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: brainbrush-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # React quickly to load spikes
      policies:
        - type: Pods
          value: 2                      # Add up to 2 pods at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # Wait 5 min before scaling down (avoid flapping)
      policies:
        - type: Pods
          value: 1                      # Remove 1 pod at a time
          periodSeconds: 120
