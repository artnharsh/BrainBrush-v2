# ==========================================
# NGINX — WebSocket-Aware Reverse Proxy + Load Balancer
# ==========================================
# This configuration distributes incoming HTTP and WebSocket
# connections across 3 backend instances.
#
# KEY CONCEPT: ip_hash sticky sessions
# WebSocket connections require "sticky sessions" because the
# initial HTTP upgrade handshake MUST reach the same server that
# will handle the persistent WebSocket connection. Without sticky
# sessions, the upgrade request might go to Server 1 but the
# subsequent WebSocket frames go to Server 2, breaking the
# connection instantly.
#
# DS Topics: Load Balancing, Location Transparency, Middleware
# ==========================================

events {
    worker_connections 4096;  # Support many concurrent connections
}

http {
    # ==========================================
    # UPSTREAM: Backend Server Pool
    # ==========================================
    # Defines the group of backend servers that Nginx will
    # distribute traffic across.
    #
    # ip_hash ensures the same client IP always routes to the
    # same backend server (sticky sessions for WebSocket).
    upstream backend_servers {
        ip_hash;  # Sticky sessions based on client IP
        server backend-1:5000;
        server backend-2:5000;
        server backend-3:5000;
    }

    # Rate limiting zone to prevent abuse
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        # ==========================================
        # SOCKET.IO / WEBSOCKET PROXY
        # ==========================================
        # Socket.IO first does an HTTP polling handshake, then
        # upgrades to WebSocket. Both paths must be proxied
        # correctly with the right headers.
        location /socket.io/ {
            proxy_pass http://backend_servers;

            # WebSocket upgrade headers — CRITICAL
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Preserve client IP and host info
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Custom header to track which instance handled the request
            add_header X-Instance-ID $upstream_addr always;

            # Long timeout for WebSocket connections (1 hour)
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Disable buffering for real-time streaming
            proxy_buffering off;
        }

        # ==========================================
        # API PROXY (REST endpoints)
        # ==========================================
        location /auth/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ==========================================
        # HEALTH CHECK ENDPOINT
        # ==========================================
        location /health {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
        }

        # ==========================================
        # FRONTEND — Static React SPA
        # ==========================================
        # In the scaled deployment, the frontend container
        # serves the built React app. Nginx proxies to it
        # or serves static files directly.
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
