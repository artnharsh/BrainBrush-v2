---
- name: Deploy BrainBrush Scaled Application
  hosts: servers
  become: true

  vars_files:
    - vars.yml

  vars:
    app_dir: /home/ubuntu/brainbrush
    docker_hub_user: "{{ docker_hub_user | default('caliber001') }}"
    docker_image_tag: "{{ docker_image_tag | default('latest') }}"
    redis_url: "{{ redis_url | default('redis://redis:6379') }}"
    jwt_secret: "{{ jwt_secret | default('supersecretjwtkey123') }}"
    google_client_id: "{{ google_client_id | default('') }}"
    google_client_secret: "{{ google_client_secret | default('') }}"
    frontend_url: "{{ frontend_url | default('http://' ~ ansible_host ~ '.nip.io') }}"

  tasks:
    - name: Copy production Docker Compose file to server
      ansible.builtin.template:
        src: templates/docker-compose.prod.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy Nginx config to server
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: "{{ app_dir }}/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Copy frontend Nginx config to server
      ansible.builtin.copy:
        src: ../frontend/nginx.conf
        dest: "{{ app_dir }}/frontend-nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Create .env file from template
      ansible.builtin.template:
        src: templates/.env.j2
        dest: "{{ app_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Log in to Docker Hub
      ansible.builtin.command:
        cmd: "docker login -u {{ docker_hub_user }} -p {{ docker_hub_password }}"
      no_log: true
      changed_when: true
      when: docker_hub_password is defined

    - name: Pull latest backend image
      ansible.builtin.command:
        cmd: "docker pull {{ docker_hub_user }}/brainbrush-backend:{{ docker_image_tag }}"
      register: pull_backend
      changed_when: "'Downloaded newer image' in pull_backend.stdout or 'Pull complete' in pull_backend.stdout"

    - name: Pull latest frontend image
      ansible.builtin.command:
        cmd: "docker pull {{ docker_hub_user }}/brainbrush-frontend:{{ docker_image_tag }}"
      register: pull_frontend
      changed_when: "'Downloaded newer image' in pull_frontend.stdout or 'Pull complete' in pull_frontend.stdout"

    - name: Stop existing containers (if running)
      ansible.builtin.command:
        cmd: docker compose down
        chdir: "{{ app_dir }}"
      ignore_errors: true

    - name: Start application with Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ app_dir }}"

    - name: Patch frontend API endpoints with actual server host
      ansible.builtin.command:
        cmd: docker exec brainbrush-frontend sh -c "sed -i -E 's|http://(brainbrush\\.harshxdev\\.tech\|[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+)(\\.nip\\.io)?|http://{{ ansible_host }}.nip.io|g' /usr/share/nginx/html/assets/*.js"
      changed_when: true

    - name: Wait for backend instances to be ready
      ansible.builtin.uri:
        url: "http://localhost/health"
        status_code: 200
        timeout: 5
      register: health_check
      retries: 20
      delay: 5
      until: health_check.status is defined and health_check.status == 200
      ignore_errors: true

    - name: Check all containers are running
      ansible.builtin.command:
        cmd: docker ps --format "table {{'{{'}}.Names{{'}}'}}\t{{'{{'}}.Status{{'}}'}}"
      register: docker_status
      changed_when: false

    - name: Print deployment status
      ansible.builtin.debug:
        msg: |
          ✅ BrainBrush SCALED deployment complete!
          🌐 Frontend: http://{{ ansible_host }}
          🔌 Backend (3 instances behind Nginx LB):
             - backend-1, backend-2, backend-3
          📦 Images: {{ docker_hub_user }}/brainbrush-*:{{ docker_image_tag }}
          
          Running containers:
          {{ docker_status.stdout }}

    - name: Remove unused Docker images
      ansible.builtin.command:
        cmd: docker image prune -af
      changed_when: true
